[project]
name = "bpm-detector"
version = "1.2.0"
description = "A Python tool for automatic detection of BPM (tempo) and musical key from audio files"
authors = [
    { name = "libraz", email = "libraz@libraz.net" }
]
dependencies = [
    "librosa>=1.0.1",
    "soundfile>=0.14.0",
    "audioread>=3.1.0",
    "numpy>=2.5.5",
    "tqdm>=4.70.1",
    "colorama>=0.4.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "resampy>=0.4.3",
]
readme = "README.md"
requires-python = ">= 3.12"
license = { text = "MIT" }
keywords = ["audio", "music", "bpm", "tempo", "key", "detection", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/libraz/bpm-detector"
Repository = "https://github.com/libraz/bpm-detector"
Issues = "https://github.com/libraz/bpm-detector/issues"

[project.scripts]
bpm-detector = "bpm_detector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "autoflake>=2.4.0",
    "monkeytype>=23.3.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bpm_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --verbose"
filterwarnings = [
    "ignore::UserWarning:librosa.*",
    "ignore::RuntimeWarning:sklearn.*",
    "ignore::RuntimeWarning:numpy.*",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore:n_fft=.*:UserWarning",
    "ignore:Trying to estimate tuning.*:UserWarning",
    "ignore:divide by zero encountered.*:RuntimeWarning",
    "ignore:overflow encountered.*:RuntimeWarning",
    "ignore:invalid value encountered.*:RuntimeWarning",
]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = true
skip-magic-trailing-comma = true


[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "silent"
show_column_numbers = true
show_error_codes = true
packages = ["bpm_detector"]
mypy_path = "src"
exclude = [
    "examples/.*",
]

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "pandas.*",
    "psutil.*",
    "tqdm.*",
    "colorama.*",
    "resampy.*"
]
ignore_missing_imports = true
